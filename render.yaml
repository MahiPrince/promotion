services:
  - type: web
    name: promotion-v0
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATA_ROOT
        value: /var/data/promotion
      - key: OPENAI_MODEL
        value: gpt-5.6-terra
    disk:
      name: promotion-data
      mountPath: /var/data
      sizeGB: 10
